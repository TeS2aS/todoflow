<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reinitialiser le mot de passe - TodoFlow</title>
  <link rel="stylesheet" href="styles.css">
  <script src="env.js" defer></script>
  <script src="reset-password.js" defer></script>
</head>
<body>
  <main class="app-shell auth-layout reset-page">
    <section class="auth-copy">
      <p class="eyebrow">Securite</p>
      <h1>Nouveau mot de passe</h1>
      <p>Choisissez un mot de passe solide pour reprendre votre session TodoFlow.</p>
    </section>

    <form id="resetPasswordForm" class="auth-card" novalidate>
      <div class="field">
        <label for="resetTokenInput">Token</label>
        <input id="resetTokenInput" name="token" type="text" autocomplete="off" required>
      </div>
      <div class="field">
        <label for="newPasswordInput">Nouveau mot de passe</label>
        <input id="newPasswordInput" name="password" type="password" minlength="8" maxlength="72" autocomplete="new-password" required>
        <p id="newPasswordError" class="error"></p>
      </div>
      <button id="resetSubmitButton" class="primary-button" type="submit">Reinitialiser</button>
      <a class="link-button" href="index.html">Retour connexion</a>
      <p id="resetStatus" class="status" role="status" aria-live="polite"></p>
    </form>
  </main>
</body>
</html>
